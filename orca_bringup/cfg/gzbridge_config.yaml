
# Left passive images and camera info
- ros_topic_name: "/Passive/left/image_raw"
  gz_topic_name: "/Passive/left/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: "GZ_TO_ROS"

- ros_topic_name: "/Passive/left/camera_info"
  gz_topic_name: "/Passive/left/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: "GZ_TO_ROS"
  
# Right passive images and camera info
- ros_topic_name: "/Passive/right/image_raw"
  gz_topic_name: "/Passive/right/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: "GZ_TO_ROS"

- ros_topic_name: "/Passive/right/camera_info"
  gz_topic_name: "/Passive/right/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: "GZ_TO_ROS"

# Ground Truth Odometry
- ros_topic_name: "/model/bluerov2/odometry"
  gz_topic_name: "/model/bluerov2/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: "GZ_TO_ROS"

# Ground Truth Pose Array
- ros_topic_name: "/model/bluerov2/pose"
  gz_topic_name: "/model/bluerov2/pose"
  ros_type_name: "geometry_msgs/msg/PoseArray"
  gz_type_name: "gz.msgs.Pose_V"
  direction: "GZ_TO_ROS"

# IMU com o remapeamento desejado aplicado diretamente no nome do tópico ROS
- ros_topic_name: "model/bluerov2/imu"
  gz_topic_name: "/world/inpetu/model/bluerov2/link/base_link/sensor/imu_sensor/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: "GZ_TO_ROS"

# DVL
- ros_topic_name: "/model/bluerov2/dvl/velocity"
  gz_topic_name: "/model/bluerov2/dvl/velocity"
  ros_type_name: "marine_acoustic_msgs/msg/Dvl"
  gz_type_name: "gz.msgs.DVLVelocityTracking"
  direction: "GZ_TO_ROS"

# Clock
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: "GZ_TO_ROS"